# Integration-test configuration.
# Uses embedded H2 in PostgreSQL compatibility mode so tests never touch Neon.
# NOTE: portable DDL in db/migration keeps H2/Postgres parity; Testcontainers
# will replace H2 in a later milestone to remove this constraint entirely.
spring:
  datasource:
    url: jdbc:h2:mem:scribl;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
